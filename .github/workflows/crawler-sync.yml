name: crawler-sync

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 */6 * * *" # tiap 6 jam (00,06,12,18 UTC)

concurrency:
  group: crawler-sync
  cancel-in-progress: false

jobs:
  crawl-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run crawler
        run: |
          set -e
          npm run sync-pdfs

      - name: Validate crawler output
        run: |
          set -e
          echo "=== public/pdfs ==="
          ls -R public/pdfs || (echo "public/pdfs missing" && exit 1)
          count=$(find public/pdfs -type f -name "*.pdf" | wc -l)
          echo "pdf count=$count"
          if [ "$count" -eq 0 ]; then
            echo "ERROR: no pdf generated — fail workflow"
            exit 1
          fi
          echo "=== sizes ==="
          du -sh public/pdfs/* || true
          find public/pdfs -type f -name "*.pdf" -exec ls -lh {} \; | head -30

      - name: Sync PDFs to VPS
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -avzr --delete
          path: public/pdfs/
          remote_path: /var/www/WP/fast/public/pdfs/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}
          remote_port: ${{ secrets.VPS_PORT }}

      - name: Fix perms and revalidate
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}

          script: |
            set -e

            echo "=== VPS PDF count ==="

            find /var/www/WP/fast/public/pdfs \
            -type f \
            -name "*.pdf" | wc -l


            echo "=== Fix permissions ==="

            find /var/www/WP/fast/public/pdfs \
            -type d \
            -exec chmod 755 {} \;

            find /var/www/WP/fast/public/pdfs \
            -type f \
            -name "*.pdf" \
            -exec chmod 644 {} \;


            echo "=== Revalidate ==="

            if [ -n "${{ secrets.REVALIDATE_SECRET }}" ]; then

              curl -fsS \
              -X POST \
              -H "x-revalidate-secret: ${{ secrets.REVALIDATE_SECRET }}" \
              http://fast.if.unsil.ac.id/api/revalidate

            else

              curl -fsS \
              -X POST \
              http://fast.if.unsil.ac.id/api/revalidate || \
              echo "revalidate skipped"

            fi


            echo "done"
